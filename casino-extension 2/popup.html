<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f0f2f5;
      --card:       #ffffff;
      --border:     #e0e4ea;
      --text:       #1a1d23;
      --text-2:     #6b7280;
      --accent:     #1a73e8;
      --accent-fg:  #ffffff;
      --accent-soft:#e8f0fd;
      --success:    #16a34a;
      --error:      #dc2626;
      --teal:       #0d9488;
      --teal-fg:    #ffffff;
      --teal-soft:  #ccfbf1;
      --radius:     10px;
      --radius-sm:  6px;
      --shadow:     0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md:  0 4px 12px rgba(0,0,0,.10), 0 1px 4px rgba(0,0,0,.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #111318;
        --card:       #1e2029;
        --border:     #2d3142;
        --text:       #e8eaed;
        --text-2:     #8b9099;
        --accent:     #5b9cf8;
        --accent-fg:  #0d1117;
        --accent-soft:#1a2a45;
        --success:    #4ade80;
        --error:      #f87171;
        --teal:       #14b8a6;
        --teal-fg:    #0d1117;
        --teal-soft:  #0f2f2b;
        --shadow:     0 1px 3px rgba(0,0,0,.3);
        --shadow-md:  0 4px 12px rgba(0,0,0,.4);
      }
    }

    body {
      font-family: 'Google Sans', 'Segoe UI', system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-width: 520px;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── Shell ── */
    .shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      padding: 16px 20px 0;
      background: var(--bg);
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .header-logo {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--shadow-md);
    }
    .header-logo svg { color: white; }
    .header-titles { flex: 1; }
    .header-titles h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.3px;
      color: var(--text);
      line-height: 1.2;
    }
    .header-titles small {
      font-size: 10px;
      color: var(--text-2);
      font-weight: 400;
      letter-spacing: .02em;
    }

    /* ── Nav tabs ── */
    .nav {
      display: flex;
      gap: 2px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3px;
      box-shadow: var(--shadow);
    }
    .nav-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 8px;
      border: none;
      border-radius: 7px;
      background: none;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
      filter: none;
    }
    .nav-btn.active {
      background: var(--accent);
      color: var(--accent-fg);
      box-shadow: var(--shadow);
    }
    .nav-btn:hover:not(.active) {
      background: var(--border);
      color: var(--text);
    }

    /* ── Main content ── */
    .content {
      padding: 12px 20px 20px;
      flex: 1;
    }

    /* ── Pages ── */
    .page { display: none; flex-direction: column; gap: 10px; }
    .page.active { display: flex; }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-2);
    }

    /* ── Inputs ── */
    textarea, input[type=text], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea { resize: vertical; min-height: 72px; }
    textarea:focus, input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    textarea::placeholder, input::placeholder { color: var(--text-2); }
    select { cursor: pointer; }

    label.lbl {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-2);
      display: block;
      margin-bottom: 4px;
    }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      transition: filter .15s, opacity .15s;
      white-space: nowrap;
      line-height: 1;
    }
    button:disabled { opacity: .38; cursor: default; }
    button:not(:disabled):hover { filter: brightness(.92); }
    button:not(:disabled):active { filter: brightness(.85); }

    .btn-primary  { background: var(--accent); color: var(--accent-fg); }
    .btn-teal     { background: var(--teal);   color: var(--teal-fg);   }
    .btn-ghost    { background: var(--bg);  color: var(--text);  border: 1px solid var(--border); }
    .btn-orange   { background: #e37400; color: #fff; }
    .btn-green    { background: #1e8e3e; color: #fff; }

    @media (prefers-color-scheme: dark) {
      .btn-orange { background: #b35900; }
      .btn-green  { background: #166534; }
    }

    /* ── Status ── */
    .status-area { display: flex; flex-direction: column; gap: 2px; min-height: 16px; }
    .status-progress { font-size: 11px; color: var(--accent); font-style: italic; }
    .status-log .ok    { color: var(--success); font-size: 12px; }
    .status-log .err   { color: var(--error);   font-size: 12px; }
    .status-log .retry { color: var(--text-2);  font-size: 12px; font-style: italic; }

    /* ── Collector table ── */
    .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    thead th {
      background: var(--accent); color: var(--accent-fg);
      padding: 5px 8px; text-align: left; font-weight: 600;
      white-space: nowrap; position: sticky; top: 0;
    }
    tbody td { padding: 4px 8px; border-bottom: 1px solid var(--border); min-width: 80px; max-width: 200px; vertical-align: top; }
    .cell-inner { max-height: 72px; overflow-y: auto; word-break: break-word; white-space: pre-line; font-size: 11px; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) { background: var(--bg); }
    tbody tr:hover { background: var(--accent-soft); }
    .row-copy-btn { padding: 1px 5px; font-size: 11px; line-height: 1.4; min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; color: var(--text-2); opacity: 0.6; }
    .row-copy-btn:hover { opacity: 1; background: var(--accent-soft); }
    tbody td:first-child { padding: 2px 4px; width: 24px; min-width: 24px; max-width: 24px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Role overlay ── */
    .role-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .role-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-md);
      padding: 32px 28px; width: 300px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      text-align: center;
    }
    .role-card h2 { font-size: 19px; font-weight: 700; color: var(--text); }
    .role-card p  { font-size: 12px; color: var(--text-2); margin-top: -6px; }
    .role-btn {
      width: 100%; padding: 13px; border-radius: var(--radius);
      font-size: 14px; font-weight: 600; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: filter .15s; font-family: inherit;
    }
    .role-btn:hover { filter: brightness(.9); }
    .role-btn-sport { background: var(--accent); color: #fff; }
    .role-btn-fraud { background: #dc2626; color: #fff; }
    @media (prefers-color-scheme: dark) { .role-btn-fraud { background: #b91c1c; } }

    /* ── Role badge + switch ── */
    .role-badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 10px; color: #fff; letter-spacing: .04em; flex-shrink: 0;
    }
    .role-switch-btn {
      background: none; border: none; padding: 5px 7px; margin-left: auto;
      color: var(--text-2); font-size: 15px; cursor: pointer; flex-shrink: 0;
      border-radius: var(--radius-sm); line-height: 1; font-family: inherit;
    }
    .role-switch-btn:hover { background: var(--border); color: var(--text); }

    /* ── Field toggles (fraud) ── */
    .field-toggles { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 0 0; }
    .field-toggle {
      display: flex; align-items: center; gap: 4px; padding: 3px 9px;
      border-radius: 12px; font-size: 11px; cursor: pointer;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); user-select: none;
    }
    .field-toggle input { accent-color: var(--accent); cursor: pointer; margin: 0; }

    /* ── Pairs ── */
    .field-row { display: flex; gap: 8px; }
    .field-row > * { flex: 1; }
    .field-row .field-narrow { flex: 0 0 140px; }

    .links-list {
      display: flex; flex-direction: column; gap: 4px;
      max-height: 300px; overflow-y: auto;
    }
    .link-row {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 11px;
    }
    .link-row a {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .link-row a.visited { color: var(--success); }
    .link-row .icn-btn {
      flex-shrink: 0; background: none; border: none; padding: 2px 5px;
      border-radius: 4px; cursor: pointer; color: var(--text-2); font-size: 11px;
      filter: none; font-family: inherit;
    }
    .link-row .icn-btn:hover { background: var(--border); color: var(--text); }

    .meta-line { font-size: 11px; color: var(--text-2); }

    .prog-wrap { display: flex; flex-direction: column; gap: 3px; }
    .prog-bar-bg { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .prog-bar    { height: 100%; background: var(--teal); width: 0%; transition: width .2s; }

    /* ── Find results ── */
    .find-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
    .find-card {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .find-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .find-info { flex: 1; min-width: 0; }
    .find-name  { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .find-email { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .find-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .find-actions button {
      padding: 4px 9px; font-size: 11px; border-radius: 12px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
    }
    .find-actions a {
      padding: 4px 9px; font-size: 11px; border-radius: 12px;
      background: var(--accent); color: var(--accent-fg);
      text-decoration: none; display: inline-flex; align-items: center;
      font-weight: 500;
    }
    .find-actions a:hover { filter: brightness(.9); text-decoration: none; }
    .find-empty { font-size: 12px; color: var(--text-2); text-align: center; padding: 20px; }

    /* ── Logs tab ── */
    #pageLogs input[type="date"],
    #pageLogs input[type="time"],
    #pageLogs input[type="number"] {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text);
      font-size: 12px; font-family: inherit; outline: none;
      transition: border-color .15s, box-shadow .15s;
      color-scheme: light dark;
    }
    #pageLogs input[type="date"]:focus,
    #pageLogs input[type="time"]:focus,
    #pageLogs input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .logs-list {
      max-height: 156px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg);
    }
    .logs-item {
      display: flex; align-items: center; padding: 5px 10px;
      gap: 8px; cursor: pointer;
      border-bottom: 1px solid var(--border); font-size: 12px;
      transition: background .1s;
    }
    .logs-item:last-child { border-bottom: none; }
    .logs-item:hover { background: var(--accent-soft); }
    .logs-item input[type="checkbox"] {
      width: auto; accent-color: var(--accent); cursor: pointer; flex-shrink: 0;
    }
    .logs-item .li-name { flex: 1; color: var(--text); }
    .logs-item .li-id   { font-size: 10px; color: var(--text-2); }
    .logs-chip {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 12px; font-size: 12px;
      background: var(--bg); color: var(--text-2); border: 1px solid var(--border);
      margin: 2px 2px 2px 0;
    }
    .logs-chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
    .logs-chip.warn   { background: rgba(234,179,8,.15); color: #b45309; border-color: transparent; }
    .logs-chip.err    { background: rgba(220,38,38,.08); color: var(--error); border-color: transparent; }
    @media (prefers-color-scheme: dark) { .logs-chip.warn { color: #fbbf24; } }
  </style>
</head>
<body>
<div class="shell">

  <!-- Role Selection Overlay -->
  <div id="roleOverlay" class="role-overlay">
    <div class="role-card">
      <div class="header-logo" style="width:52px;height:52px;border-radius:14px;margin-bottom:4px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
      </div>
      <h2>Player Collector</h2>
      <p>Выберите ваш отдел для входа</p>
      <button id="roleSportBtn" class="role-btn role-btn-sport">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        Спорт-отдел
      </button>
      <button id="roleFraudBtn" class="role-btn role-btn-fraud">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        Фрод-отдел
      </button>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="header-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
        </svg>
      </div>
      <div class="header-titles">
        <div style="display:flex;align-items:center;gap:7px;">
          <h1>Player Collector</h1>
          <span id="roleBadge" class="role-badge"></span>
        </div>
        <small>by Merab Jejeia</small>
      </div>
      <button id="roleSwitchBtn" class="role-switch-btn" title="Сменить отдел">⚙</button>
    </div>

    <!-- Nav -->
    <nav class="nav">
      <button class="nav-btn active" id="tabCollector">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        Сбор данных
      </button>
      <button class="nav-btn" id="tabFind">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        Найти в тексте
      </button>
      <button class="nav-btn" id="tabPairs">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
        Пары кошельков
      </button>
      <button class="nav-btn" id="tabLogs">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        Логи
      </button>
    </nav>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- ── Page: Collector ── -->
    <div id="pageCollector" class="page active">
      <div class="card">
        <div class="card-title">Игроки</div>
        <div id="fieldToggles" class="field-toggles" style="display:none"></div>
        <textarea id="emailInput" placeholder="Email по одному на строку или в виде Player123 (email@domain.com)"></textarea>
        <div class="btn-row">
          <button id="startBtn" class="btn-primary">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Собрать
          </button>
          <button id="copyBtn" class="btn-orange" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            Копировать
          </button>
          <button id="clearBtn" class="btn-ghost">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            Очистить
          </button>
        </div>
        <div class="status-area">
          <div id="progress" class="status-progress"></div>
          <div id="status"   class="status-log"></div>
        </div>
      </div>
      <div id="tableContainer"></div>
    </div>

    <!-- ── Page: Find in text ── -->
    <div id="pageFind" class="page">
      <div class="card">
        <div class="card-title">Поиск аккаунтов в тексте</div>
        <textarea id="findInput" style="min-height:100px"
          placeholder="Вставьте любой текст — аккаунты вида «Имя (email@domain.com)» будут извлечены автоматически"></textarea>
        <div class="btn-row">
          <button id="findExtractBtn" class="btn-primary">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            Извлечь
          </button>
          <button id="findOpenAllBtn" class="btn-ghost" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
            Открыть все в админке
          </button>
          <button id="findCollectBtn" class="btn-green" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Собрать данные
          </button>
          <button id="findClearBtn" class="btn-ghost">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            Очистить
          </button>
        </div>
        <div id="findMeta" class="meta-line" style="display:none"></div>
        <div id="findResults" class="find-list"></div>
      </div>
    </div>

    <!-- ── Page: Pairs ── -->
    <div id="pagePairs" class="page">
      <div class="card">
        <div class="card-title">Пары адресов</div>
        <div>
          <label class="lbl">Пары кошельков (таб, запятая или пробел — разделитель, каждая пара на новой строке)</label>
          <textarea id="pairsInput" style="min-height:88px"
            placeholder="addrA  addrB&#10;addrC,addrD&#10;addrE	addrF"></textarea>
        </div>
        <div class="field-row">
          <div>
            <label class="lbl">Исключить адрес (главный кошелёк)</label>
            <input type="text" id="pairsExclude" placeholder="Например: TZC3fi5...">
          </div>
          <div class="field-narrow">
            <label class="lbl">Сервис проверки</label>
            <select id="pairsService">
              <option value="btech">BTech</option>
              <option value="payplay">PayPlay (деп + вывод)</option>
            </select>
          </div>
        </div>
        <div class="btn-row">
          <button id="pairsGenBtn" class="btn-teal">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
            Сгенерировать
          </button>
          <button id="pairsOpen20Btn" class="btn-ghost" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
            Открыть 20
          </button>
          <button id="pairsOpenBtn" class="btn-ghost" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
            Открыть все
          </button>
          <button id="pairsCopyBtn" class="btn-orange" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            Копировать
          </button>
          <button id="pairsClearBtn" class="btn-ghost">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            Очистить
          </button>
        </div>
        <div id="pairsMeta" class="meta-line" style="display:none"></div>
        <div id="pairsProgressWrap" class="prog-wrap" style="display:none">
          <div class="prog-bar-bg"><div id="pairsProgressBar" class="prog-bar"></div></div>
          <div id="pairsProgressText" class="meta-line"></div>
        </div>
        <div id="pairsLinks" class="links-list"></div>
      </div>
    </div>

    <!-- ── Page: Logs ── -->
    <div id="pageLogs" class="page">

      <div class="card">
        <div class="card-title">Период</div>
        <div class="field-row">
          <div>
            <label class="lbl">С</label>
            <div style="display:flex;gap:4px;">
              <input type="date" id="logsDateFrom" style="flex:1;min-width:0">
              <input type="time" id="logsTimeFrom" value="00:00" style="width:88px;flex-shrink:0">
            </div>
          </div>
          <div>
            <label class="lbl">По</label>
            <div style="display:flex;gap:4px;">
              <input type="date" id="logsDateTo" style="flex:1;min-width:0">
              <input type="time" id="logsTimeTo" value="23:59" style="width:88px;flex-shrink:0">
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Аналитики</div>
        <div class="btn-row" style="margin-bottom:6px;">
          <button id="logsSelectAll"  class="btn-ghost">Выбрать всех</button>
          <button id="logsSelectNone" class="btn-ghost">Снять всех</button>
        </div>
        <input type="text" id="logsSearch" placeholder="Поиск по имени или ID..." style="margin-bottom:6px;">
        <div class="logs-list" id="logsAnalystList"></div>
        <div style="margin-top:8px;">
          <label class="lbl">ID не из списка</label>
          <input type="text" id="logsManualId" placeholder="Введите ID (через запятую для нескольких)">
        </div>
      </div>

      <div class="card">
        <div class="card-title">Параметры</div>
        <div class="field-row">
          <div>
            <label class="lbl">Мин. перерыв, мин</label>
            <input type="number" id="logsMinGap" value="30" min="1">
          </div>
          <div>
            <label class="lbl">Порог опоздания, мин</label>
            <input type="number" id="logsLateThreshold" value="300" min="1">
          </div>
        </div>
        <div class="btn-row" style="margin-top:8px;">
          <button id="logsStartBtn" class="btn-primary">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Начать парсинг
          </button>
          <button id="logsExportBtn" class="btn-green" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zm-2 9l-4-4h2.5v-4h3v4H14l-3 4z"/></svg>
            Excel
          </button>
        </div>
        <div id="logsError" style="display:none;font-size:11px;color:var(--error);margin-top:6px;padding:6px 8px;background:rgba(220,38,38,.08);border-radius:var(--radius-sm);"></div>
      </div>

      <div id="logsProgress" class="card" style="display:none;">
        <div id="logsProgressText" class="meta-line">Загрузка...</div>
        <div class="prog-bar-bg" style="margin-top:6px;"><div id="logsProgressFill" class="prog-bar" style="background:var(--accent);"></div></div>
      </div>

      <div id="logsResults" class="card" style="display:none;">
        <div id="logsResultSummary" style="line-height:2.2;"></div>
      </div>

    </div>

  </div><!-- /content -->
</div><!-- /shell -->
<script src="popup.js"></script>
</body>
</html>
